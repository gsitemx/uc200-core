version: "3.9"

services:
  backend:
    build: ./backend
    container_name: nm-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/settings.yaml:/app/app/settings.yaml:ro
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/networkdb
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on: [db, redis]

  worker:
    build: ./backend
    container_name: nm-worker
    command: bash -lc "celery -A app.modules.monitoring.tasks worker --loglevel=info"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/networkdb
      - REDIS_URL=redis://redis:6379/0
    depends_on: [backend, redis]

  beat:
    build: ./backend
    container_name: nm-beat
    command: bash -lc "celery -A app.modules.monitoring.tasks beat --loglevel=info"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/networkdb
      - REDIS_URL=redis://redis:6379/0
    depends_on: [worker]

  frontend:
    build: ./frontend
    container_name: nm-frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on: [backend]

  db:
    image: postgres:15
    container_name: nm-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: networkdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nm-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on: [db]

  redis:
    image: redis:7
    container_name: nm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
